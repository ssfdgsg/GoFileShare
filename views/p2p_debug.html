<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P调试界面 (简化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #111827;
            --card-bg-color: #1f2937;
            --text-color: #d1d5db;
            --header-color: #ffffff;
            --border-color: #374151;
            --log-info: #38bdf8;
            --log-success: #34d399;
            --log-error: #f87171;
            --log-warn: #fbbF59;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .card {
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
        }
        #logContainer {
            background-color: #000;
            font-family: 'SF Mono', 'Courier New', monospace;
            height: 300px;
        }
        .log-entry {
            padding: 4px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .log-info { color: var(--log-info); }
        .log-success { color: var(--log-success); }
        .log-error { color: var(--log-error); }
        .log-warn { color: var(--log-warn); }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <!-- 头部 -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-header-color">P2P调试界面</h1>
                <p class="text-gray-400">当前用户: <span class="font-semibold">{{.username}}</span></p>
            </div>
            <div class="flex space-x-4">
                <a href="/home" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">返回主页</a>
                <a href="/logout" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">退出登录</a>
            </div>
        </header>

        <!-- 操作面板 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <!-- 注册到服务器 -->
            <div class="card rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4 text-header-color">1. 注册到信令服务器</h3>
                <p class="text-sm text-gray-400 mb-4">点击按钮，将你的网络信息注册到P2P服务器。服务器会自动为你生成一个唯一的节点密钥。</p>
                <button id="registerBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition flex items-center justify-center">
                    <svg id="regSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="regBtnText">注册</span>
                </button>
                <div id="statusInfo" class="mt-4 p-3 bg-gray-900 rounded-lg text-xs font-mono hidden">
                    <div><span class="text-gray-400">密钥:</span> <span id="nodeKey" class="text-green-400"></span></div>
                    <div><span class="text-gray-400">外网IP:</span> <span id="externalIP" class="text-blue-400"></span></div>
                    <div><span class="text-gray-400">外网端口:</span> <span id="externalPort" class="text-yellow-400"></span></div>
                </div>
            </div>

            <!-- 查询节点 -->
            <div class="card rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4 text-header-color">2. 查询P2P节点信息</h3>
                <p class="text-sm text-gray-400 mb-4">输入目标节点的密钥，从服务器获取其用于P2P连接的网络地址信息。</p>
                <div class="flex space-x-2 mb-3">
                    <input type="text" id="queryKey" placeholder="输入目标节点密钥" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="queryBtn" class="bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition flex items-center justify-center">
                        <svg id="querySpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="queryBtnText">查询</span>
                    </button>
                </div>
                <div id="queryResult" class="mt-4 p-3 bg-black rounded-lg hidden text-sm font-mono"></div>
            </div>

            <!-- P2P连接测试 -->
            <div class="card rounded-lg shadow-lg p-6">
                <h3 class="text-lg font-bold mb-4 text-header-color">3. P2P连接测试</h3>
                <p class="text-sm text-gray-400 mb-4">测试与目标节点的P2P连接状态，包括UDP打洞和QUIC连接建立。</p>
                <div class="space-y-3">
                    <input type="text" id="testKey" placeholder="输入目标节点密钥" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <div class="flex space-x-2">
                        <button id="testConnBtn" class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition flex items-center justify-center">
                            <svg id="testSpinner" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="testBtnText">测试连接</span>
                        </button>
                        <button id="connectBtn" class="flex-1 bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 transition flex items-center justify-center">
                            <svg id="connectSpinner" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span id="connectBtnText">建立连接</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- P2P状态面板 -->
        <div class="card rounded-lg shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-header-color">P2P状态</h3>
                <button id="refreshStatusBtn" class="bg-gray-600 text-white px-3 py-1 rounded-md text-sm hover:bg-gray-700">刷新状态</button>
            </div>
            <div id="p2pStatus" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 bg-gray-900 rounded-lg">
                    <h4 class="font-semibold text-gray-300 mb-2">服务状态</h4>
                    <div id="serviceStatus" class="text-sm">
                        <span class="inline-block w-3 h-3 bg-gray-500 rounded-full mr-2"></span>
                        <span>未知</span>
                    </div>
                </div>
                <div class="p-4 bg-gray-900 rounded-lg">
                    <h4 class="font-semibold text-gray-300 mb-2">连接统计</h4>
                    <div id="connectionStats" class="text-sm text-gray-400">
                        <div>活跃连接: <span id="activeConnections">0</span></div>
                        <div>总连接数: <span id="totalConnections">0</span></div>
                    </div>
                </div>
                <div class="p-4 bg-gray-900 rounded-lg">
                    <h4 class="font-semibold text-gray-300 mb-2">网络信息</h4>
                    <div id="networkInfo" class="text-sm text-gray-400">
                        <div>NAT类型: <span id="natType">未知</span></div>
                        <div>延迟: <span id="latency">-</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作日志 -->
        <div class="card rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-header-color">操作日志</h3>
                <button id="clearLogBtn" class="bg-gray-600 text-white px-3 py-1 rounded-md text-sm hover:bg-gray-700">清空日志</button>
            </div>
            <div id="logContainer" class="p-2 rounded-lg overflow-y-auto text-sm"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const registerBtn = document.getElementById('registerBtn');
            const regSpinner = document.getElementById('regSpinner');
            const regBtnText = document.getElementById('regBtnText');

            const queryBtn = document.getElementById('queryBtn');
            const queryKeyInput = document.getElementById('queryKey');
            const querySpinner = document.getElementById('querySpinner');
            const queryBtnText = document.getElementById('queryBtnText');
            const queryResultDiv = document.getElementById('queryResult');

            const testConnBtn = document.getElementById('testConnBtn');
            const connectBtn = document.getElementById('connectBtn');
            const testSpinner = document.getElementById('testSpinner');
            const connectSpinner = document.getElementById('connectSpinner');
            const testBtnText = document.getElementById('testBtnText');
            const connectBtnText = document.getElementById('connectBtnText');

            const logContainer = document.getElementById('logContainer');
            const clearLogBtn = document.getElementById('clearLogBtn');

            // --- Logger ---
            const log = (message, type = 'info') => {
                const timestamp = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                entry.innerHTML = `<span class="text-gray-500 mr-2">[${timestamp}]</span> ${message}`;
                logContainer.appendChild(entry);
                logContainer.scrollTop = logContainer.scrollHeight;
            };

            // --- API Callers ---
            const registerToServer = async () => {
                setLoadingState(registerBtn, regSpinner, regBtnText, true, '注册中...');
                log('正在向服务器注册...', 'info');
                try {
                    // Per controller logic, 'key' is required but its value is not used for generation.
                    // We send a dummy key to satisfy the backend validation.
                    const formData = new FormData();
                    formData.append('key', 'dummy_key_not_used');

                    const response = await fetch('/api/p2p/register', { 
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '注册失败');
                    }
                    
                    log('服务器注册成功!', 'success');
                    // Update status info
                    document.getElementById('nodeKey').textContent = data.key || '未返回';
                    document.getElementById('externalIP').textContent = data.ip || '未返回';
                    document.getElementById('externalPort').textContent = data.port || '未返回';
                    document.getElementById('statusInfo').classList.remove('hidden');

                } catch (error) {
                    log(`注册失败: ${error.message}`, 'error');
                } finally {
                    setLoadingState(registerBtn, regSpinner, regBtnText, false, '注册');
                }
            };

            const queryPeer = async () => {
                const key = queryKeyInput.value.trim();
                if (!key) {
                    log('请输入要查询的节点密钥', 'warn');
                    return;
                }
                setLoadingState(queryBtn, querySpinner, queryBtnText, true, '查询中...');
                log(`正在查询节点: ${key}...`, 'info');
                try {
                    const response = await fetch(`/api/p2p/query?key=${encodeURIComponent(key)}`);
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '查询失败');
                    }

                    log(`查询成功: ${key}`, 'success');
                    queryResultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    queryResultDiv.classList.remove('hidden');

                } catch (error) {
                    log(`查询失败: ${error.message}`, 'error');
                    queryResultDiv.classList.add('hidden');
                } finally {
                    setLoadingState(queryBtn, querySpinner, queryBtnText, false, '查询');
                }
            };

            const testConnection = async () => {
                const key = document.getElementById('testKey').value.trim();
                if (!key) {
                    log('请输入要测试的节点密钥', 'warn');
                    return;
                }
                setLoadingState(testConnBtn, testSpinner, testBtnText, true, '测试中...');
                log(`正在测试与节点 ${key} 的连接...`, 'info');
                try {
                    const formData = new FormData();
                    formData.append('target_key', key);

                    const response = await fetch('/api/p2p/test', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '连接测试失败');
                    }

                    log(`连接测试成功: ${data.message}`, 'success');
                } catch (error) {
                    log(`连接测试失败: ${error.message}`, 'error');
                } finally {
                    setLoadingState(testConnBtn, testSpinner, testBtnText, false, '测试连接');
                }
            };

            const connectToPeer = async () => {
                const key = document.getElementById('testKey').value.trim();
                if (!key) {
                    log('请输入要连接的节点密钥', 'warn');
                    return;
                }
                setLoadingState(connectBtn, connectSpinner, connectBtnText, true, '连接中...');
                log(`正在尝试与节点 ${key} 建立P2P连接...`, 'info');
                try {
                    const formData = new FormData();
                    formData.append('target_key', key);

                    const response = await fetch('/api/p2p/connect', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '连接建立失败');
                    }

                    log(`正在建立P2P连接: ${data.message}`, 'success');
                    if (data.data) {
                        log(`目标信息: IP=${data.data.target_ip}, Port=${data.data.target_port}`, 'info');
                    }
                } catch (error) {
                    log(`连接建立失败: ${error.message}`, 'error');
                } finally {
                    setLoadingState(connectBtn, connectSpinner, connectBtnText, false, '建立连接');
                }
            };

            const refreshP2PStatus = async () => {
                log('正在刷新P2P状态...', 'info');
                try {
                    const response = await fetch('/api/p2p/status');
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || '获取状态失败');
                    }

                    const serviceStatusEl = document.getElementById('serviceStatus');
                    const activeConnectionsEl = document.getElementById('activeConnections');
                    const totalConnectionsEl = document.getElementById('totalConnections');
                    const natTypeEl = document.getElementById('natType');

                    if (data.status === 'success' && data.data.initialized) {
                        serviceStatusEl.innerHTML = '<span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></span>已初始化';
                        log('P2P服务状态: 已初始化', 'success');

                        // Update node info if available
                        if (data.data.key) {
                            document.getElementById('nodeKey').textContent = data.data.key;
                            document.getElementById('externalIP').textContent = data.data.external_ip || '未知';
                            document.getElementById('externalPort').textContent = data.data.external_port || '未知';
                            document.getElementById('statusInfo').classList.remove('hidden');
                        }
                    } else {
                        serviceStatusEl.innerHTML = '<span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span>未初始化';
                        log('P2P服务状态: 未初始化', 'warn');
                    }

                    // Update connection stats (placeholder - would need backend support)
                    activeConnectionsEl.textContent = '0';
                    totalConnectionsEl.textContent = '0';
                    natTypeEl.textContent = '未检测';

                } catch (error) {
                    log(`状态刷新失败: ${error.message}`, 'error');
                    const serviceStatusEl = document.getElementById('serviceStatus');
                    serviceStatusEl.innerHTML = '<span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span>错误';
                }
            };

            // --- UI Helpers ---
            const setLoadingState = (button, spinner, textElement, isLoading, loadingText) => {
                button.disabled = isLoading;
                if (isLoading) {
                    spinner.classList.remove('hidden');
                    textElement.textContent = loadingText;
                    button.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    spinner.classList.add('hidden');
                    button.classList.remove('opacity-50', 'cursor-not-allowed');
                    // Reset text based on button type
                    if (button.id === 'registerBtn') textElement.textContent = '注册';
                    else if (button.id === 'queryBtn') textElement.textContent = '查询';
                    else if (button.id === 'testConnBtn') textElement.textContent = '测试连接';
                    else if (button.id === 'connectBtn') textElement.textContent = '建立连接';
                }
            };

            const clearLogs = () => {
                logContainer.innerHTML = '';
                log('日志已清空', 'info');
            };

            // --- Event Listeners ---
            registerBtn.addEventListener('click', registerToServer);
            queryBtn.addEventListener('click', queryPeer);
            testConnBtn.addEventListener('click', testConnection);
            connectBtn.addEventListener('click', connectToPeer);
            document.getElementById('refreshStatusBtn').addEventListener('click', refreshP2PStatus);

            queryKeyInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') queryPeer();
            });
            document.getElementById('testKey').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') testConnection();
            });
            clearLogBtn.addEventListener('click', clearLogs);

            // --- Initialize ---
            refreshP2PStatus(); // Load initial status
            log('P2P调试界面已加载完成', 'success');
            log('提示: 请先点击"注册"按钮初始化P2P服务', 'info');
        });
    </script>
</body>
</html>
